# Local development services. The credentials are for a throwaway local database only.
services:
  postgres:
    # Postgres 16 with the pgvector extension, for the regulatory texts index (Phase 14).
    image: pgvector/pgvector:0.8.1-pg16-trixie
    environment:
      POSTGRES_USER: shipready
      POSTGRES_PASSWORD: shipready
      POSTGRES_DB: shipready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipready -d shipready"]
      interval: 2s
      retries: 15

  # S3-compatible storage for uploaded files (Cloudflare R2 when deployed). The keys are in
  # docker/seaweedfs-s3.json and are for local use only.
  storage:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Task queue for the worker (Render Key Value when deployed).
  redis:
    image: redis:8.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # The worker, with LibreOffice for Word documents (backend/Dockerfile). Settings come from
  # backend/.env; the services are reached by their names inside Docker.
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://shipready:shipready@postgres:5432/shipready
      S3_ENDPOINT_URL: http://storage:8333
      REDIS_URL: redis://redis:6379/0
      SOFFICE_PATH: soffice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

volumes:
  pgdata:
  storagedata:
