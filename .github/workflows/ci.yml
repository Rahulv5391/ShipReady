name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipready
          POSTGRES_PASSWORD: shipready
          POSTGRES_DB: shipready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipready"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shipready:shipready@localhost:5432/shipready_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Evaluation gate: fails if any score on the validation split drops below evals/baseline.json.
      - run: uv run python -m shipgen.dataset --count 200 --seed 42 --out ../data/dataset
      - run: uv run python -m evals --pipeline empty --split validation --gate evals/baseline.json
