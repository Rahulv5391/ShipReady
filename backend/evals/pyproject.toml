[project]
name = "evals"
version = "0.1.0"
description = "Evaluation harness for ShipReady: scores a pipeline against ShipGen's labelled dataset. Never deployed."
authors = [
    { name = "Rahul Verma", email = "rahul@nebula9.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "shipgen",
    "shipready",
]

[tool.uv.sources]
shipgen = { workspace = true }
shipready = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
