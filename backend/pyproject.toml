[project]
name = "shipready"
version = "0.1.0"
description = "AI shipment readiness agent: checks Indian export documents before they reach customs"
authors = [
    { name = "Rahul Verma", email = "rahul@nebula9.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "evals",
    "shipgen",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
    "types-reportlab>=5.0.0.20261008",
]

[tool.uv.workspace]
members = ["shipgen", "evals"]

[tool.uv.sources]
shipgen = { workspace = true }
evals = { workspace = true }

[tool.ruff]
line-length = 100
src = ["src", "shipgen/src", "evals/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations", "shipgen/src", "shipgen/tests", "evals/src", "evals/tests"]

[[tool.mypy.overrides]]
# pypdfium2 ships without type hints and has no stub package.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "shipgen/tests", "evals/tests"]
addopts = "-ra --strict-markers"


[tool.alembic]
script_location = "%(here)s/migrations"
