# Regulatory texts for the compliance checks' knowledge base (PLAN.md Section 5.3), from official
# government sites only. Fetched by `python -m shipready.knowledge.fetch`; where they are indexed
# (OpenAI File Search or pgvector) is decided in Phase 14 (Decision.md D-24).
#
# version: the edition the URL serves, as the document states it. DGFT amends the Handbook of
#   Procedures chapter by chapter, so amended chapters are listed next to the full 2023 edition.
# used_by: the checks the text supports.
#
# Not listed, because no working official copy was found on 27 Oct 2026: Customs Brokers
# Licensing Regulations 2018 (old.cbic.gov.in no longer resolves), CBIC Customs Manual 2023,
# CBIC Circular 07/2024-Customs (the ICEGATE manual below restates it), and FTA agreement texts.

