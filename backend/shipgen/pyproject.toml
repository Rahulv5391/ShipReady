[project]
name = "shipgen"
version = "0.1.0"
description = "Synthetic export shipments with known ground truth, for testing and evaluating ShipReady. Never deployed."
authors = [
    { name = "Rahul Verma", email = "rahul@nebula9.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "reportlab>=5.1.0",
    "shipready",
]

[tool.uv.sources]
shipready = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
